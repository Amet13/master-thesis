name: tex-thesis

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-texlive-extra-utils
      - name: Install latexindent dependencies
        run: sudo apt-get update && sudo apt-get install -y texlive-extra-utils
      - run: pip install pre-commit==4.6.0
      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --show-diff-on-failure --color=always --all-files

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-chktex-texlive-extra-utils

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y chktex texlive-extra-utils

      - name: Lint LaTeX sources
        run: make lint

  build:
    needs: [pre-commit, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Get source date epoch
        id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build PDFs (with layer cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          outputs: type=local,dest=out
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thesis-pdfs
          path: |
            out/thesis.pdf
            out/slides/slides.pdf

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: thesis-pdfs
          path: out

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf

      - name: Validate PDFs
        run: |
          bash scripts/validate-pdf.sh out/thesis.pdf
          bash scripts/validate-pdf.sh out/slides/slides.pdf

      - name: Build summary
        run: |
          echo "## Build Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Pages | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|------|" >> "$GITHUB_STEP_SUMMARY"
          for f in out/thesis.pdf out/slides/slides.pdf; do
            pages=$(pdfinfo "$f" | awk '/^Pages:/{print $2}')
            size=$(du -h "$f" | cut -f1)
            echo "| $(basename "$f") | ${pages} | ${size} |" >> "$GITHUB_STEP_SUMMARY"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: thesis-pdfs
          path: out

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/thesis.pdf
            out/slides/slides.pdf

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            out/thesis.pdf
            out/slides/slides.pdf
